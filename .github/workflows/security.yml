name: Sécurité

# Traduit en contrôle automatique l'exigence §5 : « Aucune clé d'API ou secret
# ne doit être commité en clair dans le dépôt Git. » Un audit humain ne tient
# pas dans la durée ; ce pipeline, si.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Tous les lundis à 6 h : de nouvelles vulnérabilités sont publiées en
    # permanence, y compris sur du code que personne n'a modifié.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  secrets-scan:
    name: Recherche de secrets commités
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer l'historique complet
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analyser l'historique avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-files:
    name: Fichiers interdits
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Vérifier qu'aucun fichier sensible n'est versionné
        # Contrôle explicite et lisible, complémentaire de Gitleaks : il
        # échoue sur la PRÉSENCE du fichier, même si son contenu ne ressemble
        # à aucun motif de secret connu.
        run: |
          set -euo pipefail
          echo "Fichiers suivis correspondant à un motif sensible :"
          FOUND=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$|\.pem$|\.p12$|id_rsa$|\.keystore$|(^|/)vault\.yml$' || true)
          if [ -n "$FOUND" ]; then
            echo "$FOUND"
            echo "::error::Des fichiers sensibles sont versionnés. Retirez-les avec 'git rm --cached' et complétez .gitignore."
            exit 1
          fi
          echo "  (aucun) — conforme."

      - name: Vérifier que le Vault Ansible est bien chiffré
        run: |
          set -euo pipefail
          for f in $(git ls-files 'infra/ansible/**/vault.yml' || true); do
            if ! head -1 "$f" | grep -q 'ANSIBLE_VAULT'; then
              echo "::error::$f est versionné en CLAIR. Chiffrez-le : ansible-vault encrypt $f"
              exit 1
            fi
          done
          echo "Aucun Vault en clair."

  audit-backend:
    name: Audit des dépendances (backend)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Installer les dépendances
        working-directory: backend
        run: npm ci

      - name: Auditer les vulnérabilités élevées et critiques
        working-directory: backend
        # BLOQUANT. Les dépendances du backend sont peu nombreuses et
        # maintenues : une vulnérabilité `high` y est corrigeable, donc elle
        # doit l'être. Le seuil est à `high` et non `low` : bloquer sur la
        # moindre alerte mineure d'un outil de développement rendrait le
        # pipeline rouge en permanence, et un pipeline toujours rouge finit
        # par ne plus être lu.
        run: npm audit --audit-level=high

  audit-mobile:
    name: Audit des dépendances (mobile)
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Auditer les vulnérabilités élevées et critiques
        working-directory: frontend
        # NON BLOQUANT, et c'est un choix argumenté, pas un contournement.
        #
        # Les vulnérabilités `high` du mobile sont toutes situées dans l'arbre
        # de dépendances interne d'Expo SDK 54 (@expo/config, expo-constants,
        # expo-asset, @expo/cli). Aucune n'est corrigeable par une action de ce
        # dépôt : il faudrait migrer vers un SDK majeur supérieur, ce qui
        # touche les modules natifs et exige une campagne de tests sur
        # appareils réels — un chantier qui ne peut pas être déclenché par un
        # job de CI.
        #
        # Bloquer ici rendrait la CI définitivement rouge sans qu'aucune action
        # corrective ne soit possible. Le rapport reste donc produit et visible
        # à chaque exécution, et la migration du SDK est suivie comme une dette
        # identifiée (docs/RUNBOOK.md §8).
        continue-on-error: true
        run: |
          set -o pipefail
          npm audit --audit-level=high | tee audit-mobile.txt || true
          echo "::notice title=Audit mobile::Vulnérabilités internes au SDK Expo — non corrigeables sans migration du SDK. Voir docs/RUNBOOK.md §8."

      - name: Publier le rapport d'audit mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-mobile
          path: frontend/audit-mobile.txt
          retention-days: 30
          if-no-files-found: ignore

  ansible-lint:
    name: Qualité des playbooks Ansible
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer ansible-lint
        # Version ÉPINGLÉE. Sans épinglage, `pip install ansible-lint` récupère
        # la dernière version publiée : une nouvelle règle activée en amont fait
        # alors virer la CI au rouge sur du code inchangé, sans que personne
        # n'ait rien modifié. La montée de version devient ainsi un acte
        # délibéré, relu comme n'importe quel autre changement.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "ansible-lint~=26.8"
          ansible-lint --version

      - name: Installer les collections
        working-directory: infra/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Analyser les rôles et playbooks
        working-directory: infra/ansible
        # Profil `production` (configuré dans .ansible-lint). ansible-lint
        # détecte notamment les `command`/`shell` sans garde `creates`/`when`
        # — précisément ce que le §5 du cahier des charges proscrit au profit
        # des modules natifs.
        run: ansible-lint playbooks/ roles/

      - name: Vérifier la syntaxe des playbooks
        working-directory: infra/ansible
        run: |
          for pb in playbooks/*.yml; do
            echo "--- $pb"
            ansible-playbook --syntax-check "$pb"
          done
