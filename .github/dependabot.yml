version: 2

# Mises à jour de dépendances automatisées. Sans ce mécanisme, les
# vulnérabilités détectées par le job « Audit des dépendances » s'accumulent
# sans que personne ne s'en saisisse.
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Les PR ciblent develop, jamais main : une montée de version doit passer
    # par la recette comme n'importe quel autre changement.
    target-branch: develop
    commit-message:
      prefix: "build(deps)"
    groups:
      # Regroupe les mises à jour de développement en une seule PR : dix PR
      # séparées pour des mises à jour de patch ne seraient jamais relues.
      outils-dev:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    target-branch: develop
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Les paquets Expo doivent suivre le SDK et non npm : une montée de
      # version isolée casserait la compatibilité avec le reste du SDK.
      - dependency-name: "expo*"
      - dependency-name: "react-native"
      - dependency-name: "react"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    target-branch: develop
    commit-message:
      prefix: "ci(deps)"
