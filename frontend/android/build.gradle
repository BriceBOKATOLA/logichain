buildscript {
    ext {
        buildToolsVersion = "33.0.2"
        minSdkVersion = 23
        compileSdkVersion = 33
        targetSdkVersion = 33
        ndkVersion = "26.1.10909125"
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
    }
}


allprojects {
    repositories {
        mavenLocal()
        maven { url("$rootDir/../node_modules/react-native/android") }
        maven { url("$rootDir/../node_modules/jsc-android/dist") }
        google()
        mavenCentral()
        maven { url 'https://www.jitpack.io' }
    }
}

// Injecte les versions Android requises dans les sous-projets Android (lib/app)
subprojects { subproject ->
    // When an Android plugin is applied (library or app), set the compileSdk/buildTools
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null) {
            try { androidExt.compileSdk = rootProject.ext.compileSdkVersion as int } catch(Exception ignored) { try { androidExt.compileSdkVersion = rootProject.ext.compileSdkVersion } catch(Exception ignore) {} }
            try { androidExt.buildToolsVersion = rootProject.ext.buildToolsVersion } catch(Exception ignored) {}
        }
    }
    subproject.plugins.withId('com.android.application') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null) {
            try { androidExt.compileSdk = rootProject.ext.compileSdkVersion as int } catch(Exception ignored) { try { androidExt.compileSdkVersion = rootProject.ext.compileSdkVersion } catch(Exception ignore) {} }
            try { androidExt.buildToolsVersion = rootProject.ext.buildToolsVersion } catch(Exception ignored) {}
        }
    }
}


