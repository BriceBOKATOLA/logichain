apply plugin: "com.android.application"
// The `com.facebook.react` Gradle plugin is not required here; use
// the community `native_modules.gradle` integration at the bottom.

android {
    namespace "com.logichainplatform" // <--- Propriété obligatoire pour résoudre "No package name found"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.logichainplatform"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
}

dependencies {
    implementation("com.facebook.react:react-android:+")
}

// Cette ligne doit se trouver UNIQUEMENT ici, tout en bas de android/app/build.gradle
apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)