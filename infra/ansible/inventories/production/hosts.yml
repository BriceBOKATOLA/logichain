---
# Inventaire de PRODUCTION — VPS Hostinger.
#
# Renseigner `ansible_host` avec l'IP publique du VPS puis lancer :
#   ansible-playbook -i inventories/production/hosts.yml playbooks/site.yml
#
# Le premier passage sur une machine vierge se fait en root (Hostinger ne
# fournit que ce compte). Le rôle system_security crée ensuite l'utilisateur
# de service `deploy` : dès le second passage, basculer `ansible_user` sur
# `deploy` et laisser la connexion root SSH définitivement fermée.
all:
  children:
    logichain_servers:
      hosts:
        logichain-prod-01:
          ansible_host: 31.97.178.83
          # Premier passage sur machine vierge : surcharger en ligne de commande
          #   -e ansible_user=root
          # Le rôle system_security crée alors l'utilisateur `deploy` et installe
          # sa clé ; tous les passages suivants utilisent la valeur ci-dessous.
          ansible_user: deploy
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/logichain_deploy
      vars:
        env_name: production
