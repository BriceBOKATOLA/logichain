---
# Variables de l'environnement de RECETTE (staging).
#
# Décision d'infrastructure : la recette tourne sur LE MÊME VPS que la
# production (un seul serveur pour ce projet), jamais sur un hôte séparé.
# Chaque valeur ci-dessous qui pourrait entrer en collision avec la
# production (répertoire de release, port applicatif, nom de processus PM2,
# base de données MongoDB, fichier de vhost Nginx) est donc délibérément
# DIFFÉRENTE de inventories/production/group_vars/logichain_servers.yml.
# `system_security` et `backup` ne sont volontairement PAS rejoués pour cet
# environnement (voir --skip-tags dans le Runbook) : ce sont des réglages au
# niveau du serveur, déjà appliqués une fois par la production.
env_name: staging

app_name: logichain
app_user: deploy
app_group: deploy
# Arborescence de releases totalement séparée de la production.
app_root: /opt/logichain-staging
app_current_dir: "{{ app_root }}/current"
app_releases_dir: "{{ app_root }}/releases"
app_shared_dir: "{{ app_root }}/shared"
app_keep_releases: 3

nodejs_major_version: 20
# Port distinct de la production (4000) : les deux processus Node.js
# cohabitent sur le même VPS, chacun sur son propre port local.
app_port: 4001
pm2_app_name: logichain-api-staging
pm2_instances: 1
pm2_max_memory_restart: 400M

app_repo_url: https://github.com/BriceBOKATOLA/logichain.git
# La recette suit `develop` : c'est là que les features fusionnées sont validées
# avant d'être promues vers `main` (cf. docs/GITFLOW.md).
app_repo_branch: develop

# Sous-domaine dédié : nécessite un enregistrement DNS A
# staging.logichain.online -> IP du VPS (même IP que logichain.online).
app_domain: "staging.logichain.online"
app_domain_aliases: []
letsencrypt_email: "ebangarodmilson@gmail.com"
nginx_client_max_body_size: 10m
nginx_rate_limit_rps: 20
nginx_rate_limit_burst: 40
app_cors_origin: "https://{{ app_domain }}"

mongodb_version: "7.0"
mongodb_port: 27017
mongodb_bind_ip: 127.0.0.1
# Même instance et même replica set que la production (mongodb_bootstrap
# n'est joué qu'une fois par serveur) : seules la base et l'utilisateur
# applicatif sont propres à la recette, pour une isolation stricte des
# données sans faire tourner un second MongoDB.
mongodb_database: logichain_staging
mongodb_app_user: logichain_staging_app
mongodb_admin_user: logichain_admin
mongodb_replica_set: rs0

ssh_port: 22
deploy_authorized_keys: []
unattended_upgrades_enabled: false
