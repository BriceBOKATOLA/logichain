---
# Inventaire de RECETTE (staging).
#
# Même IP que la production : ce projet ne dispose que d'un seul VPS, la
# recette et la production cohabitent sur le même hôte (voir la note en tête
# de group_vars/logichain_servers.yml). Elles restent isolées l'une de
# l'autre au niveau applicatif : répertoires, ports, processus PM2, base de
# données et vhost Nginx séparés.
all:
  children:
    logichain_servers:
      hosts:
        logichain-staging-01:
          ansible_host: 31.97.178.83
          ansible_user: deploy
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/logichain_deploy
      vars:
        env_name: staging
