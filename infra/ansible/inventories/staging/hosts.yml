---
# Inventaire de RECETTE (staging). Structure strictement identique à la
# production : c'est ce qui garantit qu'un playbook validé en recette se
# comportera de la même façon en production.
all:
  children:
    logichain_servers:
      hosts:
        logichain-staging-01:
          ansible_host: "{{ vault_server_ip | default('CHANGEME_IP_STAGING') }}"
          ansible_user: deploy
          ansible_port: 22
          ansible_ssh_private_key_file: ~/.ssh/logichain_deploy
      vars:
        env_name: staging
