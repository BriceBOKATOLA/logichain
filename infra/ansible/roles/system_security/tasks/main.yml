---
# ===========================================================================
# Rôle System & Security
# Mise à jour des paquets, utilisateur de service non-root, pare-feu UFW,
# durcissement SSH et Fail2Ban.
#
# Idempotence : uniquement des modules natifs Ansible (apt, user, ufw,
# authorized_key, template, service). Aucun `shell`/`command` sans garde.
# ===========================================================================

- name: Vérifier que la distribution cible est bien de la famille Debian
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      Les rôles LogiChain ciblent Ubuntu/Debian (VPS Hostinger).
      Distribution détectée : {{ ansible_facts['distribution'] }}.
    success_msg: "Distribution supportée : {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}"

# --- Paquets système --------------------------------------------------------

- name: Mettre à jour le cache APT
  ansible.builtin.apt:
    update_cache: true
    # Le cache n'est rafraîchi que s'il a plus d'une heure : évite un
    # téléchargement inutile à chaque exécution du playbook.
    cache_valid_time: 3600

- name: Appliquer les mises à jour de sécurité disponibles
  ansible.builtin.apt:
    upgrade: safe
  register: apt_upgrade
  # `upgrade` rapporte "changed" dès qu'un paquet bouge, ce qui est le
  # comportement attendu : l'idempotence porte sur l'état final, pas sur
  # l'absence de nouvelles versions publiées en amont.

- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ system_base_packages }}"
    state: present

- name: Configurer le fuseau horaire
  community.general.timezone:
    name: "{{ timezone }}"

# --- Utilisateur de service non-root ---------------------------------------

- name: Créer le groupe applicatif
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Créer l'utilisateur de service non-root
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    shell: /bin/bash
    create_home: true
    # Aucun mot de passe : ce compte n'est accessible que par clé SSH.
    password: "!"
    state: present

- name: Autoriser l'utilisateur de service à utiliser sudo sans mot de passe
  ansible.builtin.copy:
    # Sans NOPASSWD, le pipeline CI/CD (non interactif) se bloquerait sur
    # l'invite sudo lors des tâches `become` du playbook de déploiement.
    content: "{{ app_user }} ALL=(ALL) NOPASSWD:ALL\n"
    dest: "/etc/sudoers.d/90-{{ app_user }}"
    owner: root
    group: root
    mode: "0440"
    # `visudo -cf` refuse d'écrire un fichier sudoers invalide : une erreur de
    # syntaxe ici rendrait sudo inutilisable sur toute la machine.
    validate: /usr/sbin/visudo -cf %s

- name: Déployer les clés publiques autorisées pour l'utilisateur de service
  ansible.posix.authorized_key:
    user: "{{ app_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ deploy_authorized_keys }}"
  when: deploy_authorized_keys | length > 0

- name: Reprendre les clés de root au premier passage si aucune clé n'est déclarée
  # Filet de sécurité anti-verrouillage : sur une machine vierge où
  # `deploy_authorized_keys` n'a pas encore été renseigné, on recopie les clés
  # déjà autorisées pour root afin que `deploy` reste joignable après le
  # durcissement SSH.
  ansible.builtin.slurp:
    src: /root/.ssh/authorized_keys
  register: root_authorized_keys
  when: deploy_authorized_keys | length == 0
  failed_when: false

- name: Installer ces clés pour l'utilisateur de service
  ansible.posix.authorized_key:
    user: "{{ app_user }}"
    key: "{{ (root_authorized_keys.content | b64decode) }}"
    state: present
  when:
    - deploy_authorized_keys | length == 0
    - root_authorized_keys.content is defined

# --- Durcissement SSH -------------------------------------------------------

- name: Déterminer si le durcissement SSH peut être appliqué sans risque
  ansible.builtin.set_fact:
    # Couper l'authentification par mot de passe alors qu'aucune clé n'est
    # installée pour `deploy` fermerait définitivement l'accès au serveur.
    ssh_hardening_safe: >-
      {{ (deploy_authorized_keys | length > 0) or (root_authorized_keys.content is defined) }}

- name: Avertir si le durcissement SSH est reporté
  ansible.builtin.debug:
    msg: >-
      Durcissement SSH IGNORÉ : aucune clé publique disponible pour
      « {{ app_user }} ». Renseignez `deploy_authorized_keys` dans les
      group_vars puis relancez le playbook.
  when: not ssh_hardening_safe

- name: Durcir la configuration du serveur SSH
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    # Le préfixe « 00- » est CRITIQUE. Les fichiers de /etc/ssh/sshd_config.d/
    # sont lus dans l'ordre lexical, et SSH retient la PREMIÈRE valeur
    # rencontrée pour chaque directive. Les images Ubuntu de VPS déposent un
    # `50-cloud-init.conf` contenant `PasswordAuthentication yes` : avec un
    # préfixe « 99- », notre durcissement était lu APRÈS et purement ignoré —
    # le serveur restait ouvert aux attaques par force brute alors que le
    # playbook rapportait un succès.
    dest: /etc/ssh/sshd_config.d/00-logichain-hardening.conf
    owner: root
    group: root
    mode: "0644"
    # Refuse d'écrire une configuration que sshd rejetterait : sans cette
    # validation, un `reload` sur un fichier invalide couperait tout accès.
    validate: /usr/sbin/sshd -t -f %s
  when: ssh_hardening_safe
  notify: reload sshd

- name: Supprimer l'ancien fichier de durcissement mal ordonné
  # Migration : les serveurs provisionnés avant la correction ci-dessus
  # portent encore le fichier « 99- ». Le laisser en place n'aurait pas d'effet
  # néfaste, mais entretiendrait une configuration en double difficile à relire.
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/99-logichain-hardening.conf
    state: absent
  notify: reload sshd

- name: Rechercher un fichier de configuration SSH déposé par cloud-init
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
  register: cloud_init_sshd

- name: Neutraliser les réglages SSH permissifs déposés par cloud-init
  # Ceinture et bretelles : même si l'ordre lexical nous donne la priorité, on
  # retire explicitement la directive permissive de l'image du fournisseur,
  # pour qu'une relecture manuelle de la configuration ne laisse aucun doute.
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config.d/50-cloud-init.conf
    regexp: '^\s*PasswordAuthentication\s+'
    line: "PasswordAuthentication no"
    state: present
    validate: /usr/sbin/sshd -t -f %s
  when:
    - ssh_hardening_safe
    - cloud_init_sshd.stat.exists
  notify: reload sshd

- name: Appliquer immédiatement la configuration SSH
  ansible.builtin.meta: flush_handlers

- name: Relire la configuration SSH effectivement appliquée
  # `sshd -T` affiche la configuration RÉSOLUE, tous fichiers inclus confondus.
  # C'est la seule lecture qui dise la vérité : le contenu de notre template ne
  # prouve rien tant qu'un autre fichier peut le précéder.
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: sshd_effective_config
  changed_when: false
  check_mode: false

- name: Vérifier que le durcissement SSH est réellement en vigueur
  ansible.builtin.assert:
    that:
      - "'permitrootlogin no' in sshd_effective_config.stdout"
      - "'passwordauthentication no' in sshd_effective_config.stdout"
      - "'allowusers ' ~ app_user in sshd_effective_config.stdout"
    fail_msg: >-
      Le durcissement SSH n'est PAS appliqué. Configuration résolue :
      {{ sshd_effective_config.stdout_lines
         | select('match', '^(permitrootlogin|passwordauthentication|allowusers)')
         | list }}
      Vérifiez l'ordre des fichiers de /etc/ssh/sshd_config.d/ (la première
      valeur rencontrée l'emporte).
    success_msg: "SSH durci : connexion root et mots de passe refusés, accès limité à « {{ app_user }} »."
  when: ssh_hardening_safe

# --- Pare-feu UFW -----------------------------------------------------------

- name: Refuser par défaut tout le trafic entrant
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Autoriser par défaut le trafic sortant
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Ouvrir uniquement les ports nécessaires
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    comment: "{{ item.comment }}"
  loop: "{{ ufw_allowed_ports }}"

- name: Activer le pare-feu
  community.general.ufw:
    state: enabled
    logging: "on"

# --- Fail2Ban ---------------------------------------------------------------

- name: Configurer les prisons Fail2Ban
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: restart fail2ban

- name: Activer et démarrer Fail2Ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# --- Mises à jour de sécurité automatiques ---------------------------------

- name: Installer unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present
  when: unattended_upgrades_enabled

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: unattended_upgrades_enabled
