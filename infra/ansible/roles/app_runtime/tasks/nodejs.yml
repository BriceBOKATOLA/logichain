---
# --- Node.js via le dépôt officiel NodeSource ------------------------------

- name: Installer la clé de signature du dépôt NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    owner: root
    group: root
    mode: "0644"

- name: Déclarer le dépôt APT NodeSource
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nodesource.asc]
      https://deb.nodesource.com/node_{{ nodejs_major_version }}.x nodistro main
    filename: nodesource
    state: present
    update_cache: true

- name: Épingler NodeSource pour qu'il prime sur les paquets Ubuntu
  # Sans cette priorité, APT pourrait préférer le nodejs plus ancien des dépôts
  # Ubuntu et l'API démarrerait sur une version non supportée (engines: >=20).
  ansible.builtin.copy:
    content: |
      Package: nodejs
      Pin: origin deb.nodesource.com
      Pin-Priority: 700
    dest: /etc/apt/preferences.d/nodesource
    owner: root
    group: root
    mode: "0644"

- name: Installer Node.js
  ansible.builtin.apt:
    name: "nodejs"
    state: present
    update_cache: true

- name: Vérifier la version majeure de Node.js installée
  ansible.builtin.command:
    cmd: node --version
  register: node_version_check
  changed_when: false

- name: Refuser une version de Node.js non conforme au package.json
  ansible.builtin.assert:
    that:
      - node_version_check.stdout is match('^v' ~ nodejs_major_version ~ '\.')
    fail_msg: >-
      Node.js {{ node_version_check.stdout }} installé alors que la version
      {{ nodejs_major_version }}.x est requise (backend/package.json : engines).
    success_msg: "Node.js {{ node_version_check.stdout }} conforme."

- name: Installer PM2 globalement
  community.general.npm:
    name: pm2
    global: true
    state: present
