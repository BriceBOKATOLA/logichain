---
# --- Supervision du processus Node.js par PM2 -------------------------------

- name: Interroger l'état des processus PM2
  ansible.builtin.command:
    cmd: pm2 jlist
  become: true
  become_user: "{{ app_user }}"
  environment:
    PM2_HOME: "/home/{{ app_user }}/.pm2"
  register: pm2_list
  # Simple lecture d'état : ne modifie rien, donc jamais « changed ».
  changed_when: false
  failed_when: false

- name: Déterminer si l'API est déjà supervisée
  ansible.builtin.set_fact:
    pm2_app_running: >-
      {{ pm2_app_name in (pm2_list.stdout | default('[]') | from_json | map(attribute='name') | list) }}

- name: Démarrer l'API sous PM2
  # Uniquement au tout premier déploiement : ensuite, c'est le handler
  # « reload api » qui prend le relais, sans coupure de service.
  ansible.builtin.command:
    cmd: pm2 start ecosystem.config.js --env production
    chdir: "{{ app_current_dir }}/{{ app_backend_subdir }}"
  become: true
  become_user: "{{ app_user }}"
  environment:
    PM2_HOME: "/home/{{ app_user }}/.pm2"
  when: not pm2_app_running
  changed_when: true
  notify: reload api

- name: Générer le service systemd de démarrage automatique de PM2
  # Garantit que l'API redémarre toute seule après un reboot du VPS — sans
  # quoi une coupure d'alimentation laisserait le service à l'arrêt.
  ansible.builtin.command:
    cmd: >-
      pm2 startup systemd -u {{ app_user }}
      --hp /home/{{ app_user }}
    creates: "/etc/systemd/system/pm2-{{ app_user }}.service"
  register: pm2_startup

- name: Activer le service systemd PM2
  ansible.builtin.systemd:
    name: "pm2-{{ app_user }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Appliquer les rechargements en attente avant de figer l'état
  ansible.builtin.meta: flush_handlers

- name: Figer la liste des processus PM2
  # `pm2 save` écrit dump.pm2, que le service systemd relit au démarrage.
  # Sans cette étape, le redémarrage automatique ne relancerait rien.
  ansible.builtin.command:
    cmd: pm2 save --force
  become: true
  become_user: "{{ app_user }}"
  environment:
    PM2_HOME: "/home/{{ app_user }}/.pm2"
  changed_when: false

# --- Vérification de bon fonctionnement -------------------------------------

- name: Attendre que l'API réponde sur son port local
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    delay: 3
    timeout: 60

- name: Vérifier la sonde de santé de l'API
  # Contrôle de bout en bout : /health ne renvoie 200 que si la connexion
  # MongoDB est effectivement établie (sinon 503). Un déploiement qui échoue
  # ici est signalé immédiatement, avant que le trafic ne soit impacté.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    return_content: true
    status_code: 200
  register: health_check
  retries: 10
  delay: 3
  until: health_check.status == 200

- name: Afficher le résultat du déploiement
  ansible.builtin.debug:
    msg:
      - "Release déployée : {{ release_timestamp | default('inchangée') }}"
      - "Révision Git     : {{ deployed_revision | default('inconnue') }}"
      - "Santé de l'API   : {{ health_check.json.status }} (base {{ health_check.json.database }})"
