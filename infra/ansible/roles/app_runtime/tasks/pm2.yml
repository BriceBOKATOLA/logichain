---
# --- Supervision du processus Node.js par PM2 -------------------------------
#
# L'ordre des tâches est significatif :
#   1. démarrer (ou recharger) l'application ;
#   2. figer la liste des processus dans dump.pm2 ;
#   3. seulement ensuite, générer et activer l'unité systemd.
# L'unité générée par PM2 exécute `pm2 resurrect`, qui restaure les processus
# depuis dump.pm2 : l'activer avant l'étape 2 échouerait, faute d'état à
# restaurer.

- name: Interroger l'état du processus PM2
  # On s'appuie sur le CODE DE RETOUR de `pm2 describe` (0 si le processus
  # existe, 1 sinon) plutôt que sur l'analyse de `pm2 jlist`. Au tout premier
  # appel, PM2 démarre son démon et écrit une bannière AVANT le JSON : le
  # parsage échouait alors sur une sortie qui n'était pas du JSON pur.
  ansible.builtin.command:
    cmd: "pm2 describe {{ pm2_app_name }}"
  become: true
  become_user: "{{ app_user }}"
  environment:
    PM2_HOME: "/home/{{ app_user }}/.pm2"
  register: pm2_describe
  # Simple lecture d'état : ne modifie rien, donc jamais « changed ».
  changed_when: false
  failed_when: false
  check_mode: false

- name: Déterminer si l'API est déjà supervisée
  ansible.builtin.set_fact:
    pm2_app_running: "{{ (pm2_describe.rc | default(1)) == 0 }}"

- name: Démarrer l'API sous PM2
  # Uniquement au tout premier déploiement : ensuite, c'est le handler
  # « reload api » qui prend le relais, sans coupure de service.
  ansible.builtin.command:
    cmd: pm2 start ecosystem.config.js --env production
    chdir: "{{ app_current_dir }}/{{ app_backend_subdir }}"
  become: true
  become_user: "{{ app_user }}"
  environment:
    PM2_HOME: "/home/{{ app_user }}/.pm2"
  when: not pm2_app_running
  changed_when: true

- name: Appliquer les rechargements en attente
  # Les handlers « reload api » déclenchés par une nouvelle release ou un
  # changement de .env doivent être joués AVANT `pm2 save`, sinon le dump
  # figerait l'état précédent.
  ansible.builtin.meta: flush_handlers

- name: Figer la liste des processus PM2
  # `pm2 save` écrit dump.pm2, que l'unité systemd relit au démarrage du
  # serveur. Sans cette étape, un redémarrage du VPS ne relancerait rien.
  ansible.builtin.command:
    cmd: pm2 save --force
  become: true
  become_user: "{{ app_user }}"
  environment:
    PM2_HOME: "/home/{{ app_user }}/.pm2"
  changed_when: false

- name: Générer l'unité systemd de démarrage automatique de PM2
  # Garantit que l'API redémarre toute seule après un reboot du VPS — sans
  # quoi une coupure d'alimentation laisserait le service à l'arrêt.
  ansible.builtin.command:
    cmd: >-
      pm2 startup systemd -u {{ app_user }}
      --hp /home/{{ app_user }}
    creates: "/etc/systemd/system/pm2-{{ app_user }}.service"

- name: Activer l'unité systemd PM2 au démarrage
  # `enabled` seulement, sans `state: started`. Le démon PM2 tourne déjà,
  # lancé par le compte de service ; demander à systemd de le démarrer
  # maintenant exécuterait `pm2 resurrect` sur un démon vivant, ce qui n'a
  # aucun intérêt et fait échouer l'unité (Type=forking). Ce qui compte, c'est
  # que l'unité soit ACTIVÉE : elle prendra la main au prochain redémarrage.
  # `ansible.builtin.systemd` et non `systemd_service` : ce dernier n'existe
  # qu'à partir d'ansible-core 2.17, alors que les postes et le runner CI
  # tournent sur 2.16 (cf. requirements.yml).
  ansible.builtin.systemd:
    name: "pm2-{{ app_user }}"
    enabled: true
    daemon_reload: true

- name: Vérifier que le démarrage automatique est bien armé
  ansible.builtin.command:
    cmd: "systemctl is-enabled pm2-{{ app_user }}"
  register: pm2_unit_enabled
  changed_when: false
  failed_when: pm2_unit_enabled.stdout is not search('enabled')
  check_mode: false

# --- Vérification de bon fonctionnement -------------------------------------

- name: Attendre que l'API réponde sur son port local
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ app_port }}"
    delay: 3
    timeout: 60

- name: Vérifier la sonde de santé de l'API
  # Contrôle de bout en bout : /health ne renvoie 200 que si la connexion
  # MongoDB est effectivement établie (sinon 503). Un déploiement qui échoue
  # ici est signalé immédiatement, avant que le trafic ne soit impacté.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ app_port }}/health"
    return_content: true
    status_code: 200
  register: health_check
  retries: 10
  delay: 3
  until: health_check.status == 200

- name: Afficher le résultat du déploiement
  ansible.builtin.debug:
    msg:
      - "Release          : {{ release_timestamp | default('inchangée (révision déjà en service)') }}"
      - "Révision Git     : {{ (deployed_revision | default(target_revision))[:12] }}"
      - "Santé de l'API   : {{ health_check.json.status }} (base {{ health_check.json.database }})"
