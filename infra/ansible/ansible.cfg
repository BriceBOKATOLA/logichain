[defaults]
# Chemins relatifs à infra/ansible/ : toutes les commandes du Runbook se lancent
# depuis ce répertoire (ou via `npm run deploy:*` depuis la racine du dépôt).
inventory              = inventories/production/hosts.yml
roles_path             = roles
collections_path       = collections
host_key_checking      = True
retry_files_enabled    = False
interpreter_python     = auto_silent
forks                  = 10

# Sortie lisible en YAML. On utilise l'option native d'ansible-core plutôt que
# l'ancien callback `community.general.yaml`, retiré de la collection en v12 :
# dépendre d'un plugin externe pour un simple format d'affichage exposait la
# configuration à une rupture à chaque montée de version de la collection.
stdout_callback         = default
callback_result_format  = yaml
bin_ansible_callbacks   = True

# Affiche systématiquement la différence appliquée par chaque tâche : c'est le
# contrôle visuel de l'idempotence exigée (un second passage doit être « ok »
# partout, jamais « changed »).
;diff                  = True

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
become_ask_pass = False

[ssh_connection]
# Multiplexage des connexions SSH : indispensable pour que le playbook complet
# ne rouvre pas une session par tâche sur un VPS d'entrée de gamme.
pipelining   = True
ssh_args     = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
